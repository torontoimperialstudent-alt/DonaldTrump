<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Стіл Президента</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:"Comic Sans MS","Trebuchet MS",sans-serif;background:#2b3a55}
#game{max-width:760px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:#6b3513;position:relative;overflow:hidden}
#top{height:28vh;min-height:170px;display:flex;justify-content:center;align-items:flex-end;position:relative;overflow:hidden;background:linear-gradient(#ebe2b4 0 78%,#f6f1dc 78% 84%,#d8cc98 84% 100%)}
#hud{z-index:5;position:absolute;top:8px;left:10px;right:10px;display:flex;justify-content:space-between;font-weight:bold;color:#1d2b44;font-size:15px}
#flag{position:absolute;right:2%;top:6px;width:34px;height:80%;background:linear-gradient(#2a6fdb 50%,#ffd43b 50%);border:2px solid #1d2b44;border-radius:0 0 8px 8px}
#pres{width:130px;height:170px;position:relative}
.head{position:absolute;left:25px;top:8px;width:80px;height:80px;background:#f4b98a;border:4px solid #3b2a1a;border-radius:50%}
.hair{position:absolute;left:18px;top:0;width:94px;height:38px;background:#d9d9d9;border:4px solid #3b2a1a;border-radius:50px 50px 10px 10px}
.eye{position:absolute;top:36px;width:10px;height:10px;background:#222;border-radius:50%}
.mouth{position:absolute;left:28px;top:56px;width:22px;height:8px;border-bottom:4px solid #7a2020;border-radius:0 0 20px 20px;transition:.2s}
.body{position:absolute;left:5px;top:92px;width:120px;height:80px;background:#1f3a8a;border:4px solid #3b2a1a;border-radius:30px 30px 0 0}
.tie{position:absolute;left:52px;top:0;width:16px;height:60px;background:#c22;clip-path:polygon(25% 0,75% 0,100% 100%,50% 85%,0 100%)}
#pres.sad .mouth{border-bottom:none;border-top:4px solid #7a2020;border-radius:20px 20px 0 0;top:60px}
#pres.happy .mouth{height:14px;background:#fff;border-radius:0 0 20px 20px}
#desk{flex:1;position:relative;display:flex;justify-content:center;align-items:center;padding:14px;border-top:10px solid #3e220d;background:linear-gradient(135deg,#9a5427,#6b3513 55%,#9a5427)}
.stackpaper{position:absolute;width:62%;max-width:380px;height:70%;background:#fffbe9;border:2px solid #cdbf8f;border-radius:4px}
#paper{position:relative;width:78%;max-width:440px;background:#fffdf2;border:3px solid #b8a870;border-radius:6px;padding:16px 18px;box-shadow:4px 6px 0 rgba(0,0,0,.3);transform:rotate(-1.2deg);color:#222;transition:transform .35s,opacity .35s;z-index:2}
#paper.out-l{transform:translateX(-120%) rotate(-20deg);opacity:0}
#paper.out-r{transform:translateX(120%) rotate(20deg);opacity:0}
.kind{font-size:12px;letter-spacing:1px;color:#8a7a3a;text-transform:uppercase}
#title{font-size:20px;margin:6px 0 8px;font-weight:bold}
#desc{font-size:15px;line-height:1.35;min-height:60px}
.btns{display:flex;gap:10px;margin-top:14px}
button{flex:1;padding:12px 6px;font:bold 16px inherit;font-family:inherit;border:3px solid #222;border-radius:10px;cursor:pointer;box-shadow:0 4px 0 #222}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #222}
#sign{background:#4ecb71}#reject{background:#ff7b6b}
#stamp{position:absolute;top:30%;left:50%;font-size:34px;font-weight:bold;border:5px solid;padding:4px 14px;border-radius:8px;transform:translate(-50%,-50%) rotate(-14deg) scale(2);opacity:0;pointer-events:none;z-index:5}
#stamp.show{animation:st .6s forwards}
@keyframes st{0%{opacity:0;transform:translate(-50%,-50%) rotate(-14deg) scale(2.4)}30%{opacity:1;transform:translate(-50%,-50%) rotate(-14deg) scale(1)}100%{opacity:0}}
#overlay{position:absolute;inset:0;background:rgba(15,20,40,.9);color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;z-index:10}
#overlay h1{margin:0 0 10px;font-size:30px}#overlay p{max-width:460px;line-height:1.4}
#overlay button{flex:none;width:auto;padding:12px 28px;background:#ffd43b;margin-top:14px}
.hidden{display:none!important}
#boom{position:absolute;inset:0;z-index:9;pointer-events:none;display:none}
#boom.go{display:block;animation:tint 2s forwards}
@keyframes tint{from{background:rgba(255,90,0,0)}to{background:rgba(255,90,0,.45)}}
@keyframes shake{0%{transform:translate(5px,3px)}50%{transform:translate(-5px,-3px)}100%{transform:translate(3px,-5px)}}
#game.nuked #top,#game.nuked #desk,#game.nuked #front{animation:shake .1s infinite}
#flash{position:absolute;inset:0;background:#fff;opacity:0}
#boom.go #flash{animation:fl 1.6s forwards}
@keyframes fl{0%{opacity:1}100%{opacity:0}}
#cloud{position:absolute;left:50%;top:2%;width:200px;height:26vh;min-height:170px;transform:translateX(-50%) scale(0);transform-origin:bottom}
#boom.go #cloud{animation:grow 1.8s .15s forwards}
@keyframes grow{to{transform:translateX(-50%) scale(1.3)}}
.cap{position:absolute;left:10px;top:0;width:180px;height:90px;background:radial-gradient(#ffe066,#ff8a1f 60%,#7a2a0a);border:4px solid #3b1a0a;border-radius:50%}
.c2{left:40px;top:-20px;width:120px;height:70px}
.stem{position:absolute;left:75px;top:70px;width:50px;height:100px;background:linear-gradient(90deg,#ff8a1f,#ffd34d,#ff8a1f);border:4px solid #3b1a0a;border-radius:10px 10px 0 0}
.win{position:absolute;top:10px;width:22%;height:62%;background:linear-gradient(#bfe3f7,#eaf6ff);border:4px solid #f6f1dc;box-shadow:0 0 0 2px #b9ad7a}
.cur{position:absolute;top:0;width:5%;height:78%;background:repeating-linear-gradient(90deg,#c9a94a 0 4px,#a98a30 4px 8px);border-radius:0 0 10px 10px}
#usflag{position:absolute;left:2%;top:6px;width:34px;height:80%;background:repeating-linear-gradient(#c0262d 0 7px,#fff 7px 14px);border:2px solid #1d2b44;border-radius:0 0 8px 8px}
#usflag::before{content:"";position:absolute;left:0;top:0;width:55%;height:45%;background:#243b82}
.chair{position:absolute;left:-12px;top:22px;width:154px;height:150px;background:#2e4a3a;border:4px solid #1b2c22;border-radius:50px 50px 0 0}
#from{font-size:13px;color:#555;border-bottom:1px dashed #b8a870;padding-bottom:6px}
#drink{position:absolute;right:6px;bottom:6px;width:80px;z-index:3;filter:drop-shadow(2px 3px 0 rgba(0,0,0,.3))}
.tray{position:absolute;left:8px;top:8px;width:56px;height:24px;background:#151515;border:2px solid #000;border-radius:3px;z-index:1}
#front{flex:none;height:64px;background:linear-gradient(#7a4217,#5a2f10);border-top:4px solid #3e220d;display:flex;justify-content:center;align-items:center;gap:8px;padding:0 10px}
.panel{flex:1;height:44px;border:3px solid #3e220d;border-radius:6px;background:#8a4b22;box-shadow:inset 0 0 0 3px #a8622f}
.seal{flex:none;width:56px;height:56px;border-radius:50%;background:#e9d9a0;border:3px solid #3e220d;display:flex;align-items:center;justify-content:center;font-size:28px}
</style></head><body>
<div id="game">
 <div id="top">
  <div id="hud"><span id="prog"></span><span id="score"></span></div>
  <div id="usflag"></div><div id="flag"></div>
  <div class="cur" style="left:7%"></div><div class="win" style="left:12%"></div><div class="cur" style="left:34%"></div>
  <div class="win" style="left:39%"></div><div class="cur" style="left:61%"></div>
  <div class="win" style="left:66%"></div><div class="cur" style="left:88%"></div>
  <div id="pres"><div class="chair"></div><div class="body"><div class="tie"></div></div><div class="head"><div class="eye" style="left:20px"></div><div class="eye" style="left:50px"></div><div class="mouth"></div></div><div class="hair"></div></div>
 </div>
 <div id="desk">
  <div class="stackpaper" style="transform:rotate(3deg)"></div>
  <div class="stackpaper" style="transform:rotate(-4deg)"></div>
  <div id="paper"><div class="kind" id="kind"></div><div id="from"></div><div id="title"></div><div id="desc"></div>
   <div class="btns"><button id="sign">✍️ Підписати</button><button id="reject">🚫 Відхилити</button></div></div>
  <div class="tray"></div>
  <svg id="drink" viewBox="0 0 40 100"><rect x="14" y="0" width="12" height="8" rx="2" fill="#f4c20d"/><path d="M15 8h10v14c0 6 9 10 9 22v48c0 4-3 6-6 6H12c-3 0-6-2-6-6V44c0-12 9-16 9-22z" fill="#7bc043" stroke="#2f5d1a" stroke-width="2"/><rect x="6" y="48" width="28" height="32" fill="#fff6c8"/><text x="20" y="60" font-size="10" text-anchor="middle">🍏</text><text x="20" y="73" font-size="7.5" text-anchor="middle" font-weight="bold" fill="#2f7d1a">Живчик</text></svg>
  <div id="stamp"></div>
 </div>
 <div id="front"><div class="panel"></div><div class="panel"></div><div class="seal">🦅</div><div class="panel"></div><div class="panel"></div></div>
 <div id="boom"><div id="cloud"><div class="stem"></div><div class="cap"></div><div class="cap c2"></div></div><div id="flash"></div></div>
 <div id="overlay"><h1>🏛️ Стіл Президента</h1>
  <p>Ви — президент. На столі 10 документів. Підписуйте те, що допомагає Україні. Якщо підпишете хоч один документ, вигідний Росії, — гра закінчується. Дивіться, від кого документ: відправник не завжди каже правду.</p>
  <button id="start">Почати</button></div>
</div>
<script>
const GOOD=[
["Угода про рідкісноземельні метали","Інвестувати у видобуток рідкоземельних металів на заході України."],
["Пакет військової допомоги","Передати Україні додаткові системи ППО та боєприпаси."],
["Заморожені активи","Спрямувати конфісковані російські активи на відбудову України."],
["Нові санкції","Запровадити санкції проти російського нафтового флоту."],
["Меморандум про безпеку","Підтвердити гарантії безпеки для України."],
["Тренувальна місія","Розширити навчання українських військових."],
["Енергетична підтримка","Фінансувати відновлення української енергосистеми."],
["Спільне виробництво дронів","Запустити спільні заводи з виробництва дронів."],
["Гуманітарний коридор","Підтримати повернення депортованих українських дітей."],
["Вступ до альянсу","Підтримати євроатлантичний шлях України."],
["Дипломатичний демарш","Висміяти агресора у дипломатичному комюніке світовим лідерам."],
["Відбудова портів","Профінансувати відновлення портів Одещини."]];
const BAD=[
["Зняти санкції","Скасувати всі санкції проти російських банків."],
["Скоротити допомогу","Зменшити підтримку України вдвічі."],
["Зупинити постачання зброї","Призупинити передачу ракет для ППО."],
["«Дружній» контракт","Продати Росії високотехнологічні мікросхеми."],
["Розблокувати активи","Повернути заморожені активи російським олігархам."],
["Нова угода про «мир»","Визнати окуповані території російськими."],
["Розвідка під питанням","Припинити обмін розвідданими з Україною."],
["Дозвіл на експорт","Дозволити експорт обладнання для російських заводів."],
["Скасувати візові обмеження","Зняти заборону на в’їзд для чиновників-агресорів."],
["Зменшити тиск на нафту","Скасувати стелю цін на російську нафту."],
["Відмова від трибуналу","Закрити розслідування воєнних злочинів."],
["Інформаційна пауза","Припинити мовлення українською для окупованих територій."]];
const FG=["Державний департамент","Міністерство оборони","Міністерство фінансів","Рада національної безпеки","Сенатський комітет із закордонних справ","Посольство України"];
const FB=["Лобістська фірма «Північний Вітер»","Фонд «Мир без меж» (Москва)","Анонімний «консультант»","Агентство «Друзі Півночі»","Бізнес-партнер олігарха","Невідомий відправник"];
function pick(g){const own=Math.random()<0.75?g:!g;const a=own?FG:FB;return a[Math.floor(Math.random()*a.length)]}
const $=id=>document.getElementById(id);
let deck,i,score,busy;
function shuffle(a){for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function start(){
 const g=shuffle(GOOD.slice()).slice(0,5).map(d=>({t:d[0],d:d[1],good:1,f:pick(1)}));
 const b=shuffle(BAD.slice()).slice(0,5).map(d=>({t:d[0],d:d[1],good:0,f:pick(0)}));
 deck=shuffle(g.concat(b));i=0;score=0;busy=false;
 $('overlay').classList.add('hidden');$('boom').classList.remove('go');$('game').classList.remove('nuked');show();
}
function mood(c){$('pres').className=c}
function boom(){$('boom').classList.add('go');$('game').classList.add('nuked')}
function show(){
 const d=deck[i];$('kind').textContent="Документ №"+(i+1)+" · Цілком таємно";
 $('title').textContent=d.t;$('desc').textContent=d.d;$('from').textContent="Від: "+d.f;
 $('prog').textContent="📄 "+(i+1)+"/10";$('score').textContent="⭐ "+score;
 const p=$('paper');p.className="";mood("");busy=false;
}
function stamp(txt,col){const s=$('stamp');s.textContent=txt;s.style.color=col;s.style.borderColor=col;s.className="";void s.offsetWidth;s.className="show"}
function end(win,msg){
 const o=$('overlay');o.classList.remove('hidden');
 o.innerHTML='<h1>'+(win?'🎉 Перемога!':'💥 Кінець гри')+'</h1><p>'+msg+'</p><p>Очки: '+score+'</p><button id="again">Грати знову</button>';
 $('again').onclick=()=>{o.innerHTML='';start()};
}
function act(sign){
 if(busy)return;busy=true;const d=deck[i];
 if(sign){
  stamp("ПІДПИСАНО","#1a8f3a");
  if(!d.good){score-=1000;$('score').textContent="⭐ "+score;mood("sad");boom();setTimeout(()=>end(false,'Ви підписали: «'+d.t+'». Це вигідно Росії. Ядерний вибух! −1000 очок.'),2400);return}
  score+=10;mood("happy");
 }else{
  stamp("ВІДХИЛЕНО","#c0392b");
  if(d.good){score=Math.max(0,score-3);mood("sad")}else{score+=5;mood("happy")}
 }
 $('paper').classList.add(sign?'out-r':'out-l');
 setTimeout(()=>{i++;if(i>=10){end(true,'Ви пройшли всі 10 документів і не підписали жодного проросійського.');}else show()},550);
}
$('sign').onclick=()=>act(true);$('reject').onclick=()=>act(false);$('start').onclick=start;
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')act(true);if(e.key==='ArrowLeft')act(false)});
</script></body></html>
